<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Successful - Giant Strides Online School</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 60'><circle cx='14' cy='32' r='5' fill='%23F2A900' /><path d='M 26,50 A 29,29 0 0,1 84,50' fill='none' stroke='%231B4DF5' stroke-width='9' stroke-linecap='butt'/><line x1='41' y1='31' x2='69' y2='31' stroke='%231B4DF5' stroke-width='3'/><line x1='41' y1='37' x2='69' y2='37' stroke='%231B4DF5' stroke-width='3'/><line x1='41' y1='43' x2='69' y2='43' stroke='%231B4DF5' stroke-width='3'/><line x1='41' y1='49' x2='69' y2='49' stroke='%231B4DF5' stroke-width='3'/></svg>">
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <svg class="logo-svg" viewBox="0 0 100 60">
        <circle cx="14" cy="32" r="5" fill="#F2A900" />
        <path d="M 26,50 A 29,29 0 0,1 84,50" fill="none" stroke-width="9" stroke-linecap="butt"/>
        <line x1="41" y1="31" x2="69" y2="31" stroke-width="3"/>
        <line x1="41" y1="37" x2="69" y2="37" stroke-width="3"/>
        <line x1="41" y1="43" x2="69" y2="43" stroke-width="3"/>
        <line x1="41" y1="49" x2="69" y2="49" stroke-width="3"/>
      </svg>
      <div class="logo-text-group">
        <span class="logo-text-main">Giant Strides</span>
        <span class="logo-text-sub">Online School</span>
      </div>
    </a>
  </header>

  <main>
    <div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem; position: relative;">
      <div class="modal-icon" style="margin-bottom: 1.5rem;">✓</div>
      <h2 style="color: var(--primary); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.75rem;">
        Report Submitted Successfully!
      </h2>
      <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
        Thank you for submitting your daily class report. The administrator has received your entry.
      </p>

      <!-- Fill in another report button positioned in the bottom right corner of the card container -->
      <div style="display: flex; justify-content: flex-end; margin-top: 3rem; border-top: 1.5px solid var(--border); padding-top: 1.5rem;">
        <a href="index.html" class="btn btn-secondary" style="width: auto; padding: 0.75rem 1.5rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem;">
          Fill in another report
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <footer style="margin-top: auto;">
    &copy; 2026 Giant Strides Online School. All Rights Reserved.
  </footer>

</body>
</html>
